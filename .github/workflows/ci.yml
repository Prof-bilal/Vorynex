name: ci

on:
  push:
    branches: [main]
  pull_request:
  # proof-real needs Docker, ~2.5 GB of images and root for the Tier 1 column,
  # so it is run on demand rather than on every push.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: test -z "$(gofmt -l engine cmd cloud)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  # The Next.js app (landing + auth + dashboard). Typechecks and builds; the
  # auth/control-plane env vars are intentionally absent, which is a supported
  # state (pages render with setup notices).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: npm install --include=dev --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build

  # Containment proof, arm A (bare) vs arm C (Vorynex Tier 0). Loopback only,
  # decoy fixtures, `make proof` refuses without PROOF_AUTHORIZED=1.
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: containment proof (arm A vs arm C)
        run: make proof
      - name: false positives vs containment
        run: make fp
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-evidence
          path: |
            tests/proof/evidence/
            tests/proof/evidence-benign/
          if-no-files-found: warn

  # Contract test for the whole CLI: is there anything we ship that no test ever
  # runs? Every command and subcommand is invoked and asserted.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: every command
        run: make features
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: features-evidence
          path: tests/features/evidence/
          if-no-files-found: warn

  # The overhead harness, at a smoke setting: proves it runs and holds its load
  # integrity, without asserting thresholds on a shared runner.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: overhead harness (2 rounds)
        run: ROUNDS=2 SECONDS_PER_ARM=3 make bench

  # The real-application arm (DVWS-node): Docker, ~2.5 GB of images, and root for
  # Tier 1. Manual only; the hermetic P1/P2 arms run on every push.
  proof-real:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: real application (bare / CRS / Tier 1 live attach)
        run: make proof-real
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-real-evidence
          path: tests/proof/evidence-real/
          if-no-files-found: warn

  # Tier 0 (Landlock) enforcement validation. Runs the security lab under the
  # Vorynex spawn-time engine on the CI kernel and asserts all seven attacks are
  # contained. See docs/SECURITY_TESTING.md.
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace
      - name: capability report
        run: go run ./cmd/vorynex doctor
      - name: security lab (Tier 0)
        run: cd tests/security-lab && LAB_ENGINE=vorynex ./run-lab.sh
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence
          path: tests/security-lab/evidence/
          if-no-files-found: warn

  # The journey an operator takes, asserted end to end: build, install (from the
  # checkout and from a release tarball), capability report, observe, generate a
  # policy, run under it, contain an attack that lands unprotected, roll back a
  # failing workload, turn protection off, ingest into the control plane, and
  # build the container image. Needs no root; the image step self-skips without
  # a Docker daemon.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: end-to-end acceptance
        run: make e2e
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: tests/e2e/evidence/
          if-no-files-found: warn
